# v4: v3 + aligned pairs. For real train/val images (team phone x4 crops, FraudBench x2, 2,500 COCO x1),
# a native 512 crop (label 0) is paired with its Stable Diffusion 1.4 VAE reconstruction (label 1),
# both saved as JPEG q92. Pairs share scene, camera and compression, so only the generator trace differs.
# Test rows are identical to v3, so results compare directly.
# Build data: python -m src.models.model1_full_image.scripts.prepare_aligned_pairs --help
seed: 42
data:
  metadata: ${CVTP_DATA_ROOT}/aligned_v4/metadata.csv
  root: ${CVTP_DATA_ROOT}/aligned_v4
  leakage_columns:
  - group_id
  verify_images: true
model:
  name: efficientnet_b0
  pretrained: true
  preprocess: native_crop
  input_size: 256
  augment:
    p_downscale: 0.5
    p_jpeg: 0.3
    p_noise: 0.3
    noise_sigma:
    - 2.0
    - 10.0
    p_blur: 0.2
    blur_radius:
    - 0.3
    - 1.5
    p_sharpen: 0.2
    jpeg_quality:
    - 70
    - 95
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  drop_rate: 0.2
training:
  device: auto
  epochs: 15
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 4
  amp: true
  amp_init_scale: 1024
  patience: 4
  threshold: 0.5
  tune_threshold: true
  output_dir: outputs/model1/aligned_v4
  allow_smoke: false
  weighted_sampler: true
