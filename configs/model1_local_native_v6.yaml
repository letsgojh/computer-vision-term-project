# v6: native-resolution local-edit detector (separate branch, not a replacement of the whole-image model).
# Data: only local-edit pairs at the photo's native resolution (scripts/prepare_local_edits_native.py):
# a 320 crop inside a region regenerated by the Qwen-Image or SD1.4 VAE vs the same crop of the original.
# Resizing destroys the trace (v5), so downscale / noise / blur / sharpen augmentation is off; only
# flips and JPEG re-encoding remain. Inference scans the whole photo at native resolution.
seed: 42
data:
  metadata: ${CVTP_DATA_ROOT}/local_edits_native_v6/metadata.csv
  root: ${CVTP_DATA_ROOT}/local_edits_native_v6
  leakage_columns:
  - group_id
  verify_images: true
model:
  name: efficientnet_b0
  pretrained: true
  preprocess: native_crop
  input_size: 256
  augment:
    p_downscale: 0.0
    p_jpeg: 0.3
    p_noise: 0.0
    noise_sigma:
    - 2.0
    - 10.0
    p_blur: 0.0
    blur_radius:
    - 0.3
    - 1.5
    p_sharpen: 0.0
    jpeg_quality:
    - 70
    - 95
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  drop_rate: 0.2
training:
  device: auto
  epochs: 15
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 2
  amp: true
  amp_init_scale: 1024
  patience: 4
  threshold: 0.5
  tune_threshold: true
  output_dir: outputs/model1/local_native_v6
  allow_smoke: false
  weighted_sampler: true
