# v5: v3 + local-edit pairs. A real photo vs the same photo with one region (1-8% of the image)
# regenerated by the Qwen-Image or SD1.4 VAE and pasted back, so only the local generation trace
# differs. Pairs get 25% of each class in the weighted sampler. Test rows of v3 are unchanged;
# local-edit test pairs (incl. Kandinsky MoVQ, never trained) are extra test rows.
# Build data: python -m src.models.model1_full_image.scripts.prepare_local_edits --help
seed: 42
data:
  metadata: ${CVTP_DATA_ROOT}/local_edits_v5/metadata.csv
  root: ${CVTP_DATA_ROOT}/mixed_v3
  leakage_columns:
  - group_id
  verify_images: true
model:
  name: efficientnet_b0
  pretrained: true
  preprocess: native_crop
  input_size: 256
  augment:
    p_downscale: 0.5
    p_jpeg: 0.3
    p_noise: 0.3
    noise_sigma:
    - 2.0
    - 10.0
    p_blur: 0.2
    blur_radius:
    - 0.3
    - 1.5
    p_sharpen: 0.2
    jpeg_quality:
    - 70
    - 95
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  drop_rate: 0.2
training:
  device: auto
  epochs: 15
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 2
  amp: true
  amp_init_scale: 1024
  patience: 4
  threshold: 0.5
  tune_threshold: true
  output_dir: outputs/model1/local_edit_v5
  allow_smoke: false
  weighted_sampler: true
