# v3: v2 model and augmentation, trained on a mixed set so "real" is not only COCO web photos.
# Real: COCO + FraudBench customer product photos + team phone photos (4 photographers).
# Fake: Defactify SD2.1/SDXL/SD3 + FraudBench (4 modern generators) + team prompt-generated fakes.
# Test-only: 2 team photographers, FraudBench gpt-image-2 / nano-banana-2, Defactify DALL-E 3 / Midjourney.
# Build data: python -m src.models.model1_full_image.scripts.prepare_mixed_v3 --help
# weighted_sampler uses metadata sample_weight so each source keeps a fixed share per class.
seed: 42
data:
  metadata: ${CVTP_DATA_ROOT}/mixed_v3/metadata.csv
  root: ${CVTP_DATA_ROOT}/mixed_v3
  leakage_columns:
  - group_id
  verify_images: true
model:
  name: efficientnet_b0
  pretrained: true
  preprocess: native_crop
  input_size: 256
  augment:
    p_downscale: 0.5
    p_jpeg: 0.3
    p_noise: 0.3
    noise_sigma:
    - 2.0
    - 10.0
    p_blur: 0.2
    blur_radius:
    - 0.3
    - 1.5
    p_sharpen: 0.2
    jpeg_quality:
    - 70
    - 95
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  drop_rate: 0.2
training:
  device: auto
  epochs: 15
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.01
  num_workers: 4
  amp: true
  amp_init_scale: 1024
  patience: 4
  threshold: 0.5
  tune_threshold: true
  output_dir: outputs/model1/mixed_v3
  allow_smoke: false
  weighted_sampler: true
